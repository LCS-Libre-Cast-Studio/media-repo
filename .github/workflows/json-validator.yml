name: JSON Validator & README Updater

on:
  pull_request_target:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          allow-unsafe-pr-checkout: true

      - name: Validate JSON Syntax
        run: |
          jq . playlist.json

      - name: Update README Playlist Section
        shell: python
        run: |
          import json
          import os

          with open('playlist.json', 'r', encoding='utf-8') as f:
              playlist = json.load(f)

          md_content = ""
          for item in playlist:
              icon = "🎵" if item.get('type') == 'audio' else "🎬"
              md_content += f"* {icon} **{item.get('artist', 'Unknown')}** - {item.get('title', 'Untitled')}\n"

          if os.path.exists('README.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  readme = f.read()
              
              start_tag = "<!-- PLAYLIST_START -->"
              end_tag = "<!-- PLAYLIST_END -->"

              if start_tag in readme and end_tag in readme:
                  before = readme.split(start_tag)[0]
                  after = readme.split(end_tag)[1]
                  new_readme = f"{before}{start_tag}\n\n{md_content}\n{end_tag}{after}"
                  
                  with open('README.md', 'w', encoding='utf-8') as f:
                      f.write(new_readme)
                  print("README.md successfully updated with latest tracks.")
              else:
                  print("Placeholders not found in README.md. Skipping injection.")

      - name: Commit and Push README Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "docs: auto-update playlist section in README" && git push origin HEAD:${{ github.event.pull_request.head.ref }})
